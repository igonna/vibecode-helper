name: vibecode-dev-notify

services:
  sound-notifier:
    build: .
    command: ["python", "/app/app.py", "notifier"]
    ports:
      - "8766:8765"
    networks:
      default:
      app-network:
        aliases:
          - vibecode-dev-notify
    volumes:
      - sound-cache:/cache
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  web-monitor:
    build: .
    command: ["python", "/app/app.py", "monitor"]
    profiles:
      - monitor
    depends_on:
      - sound-notifier
    networks:
      default:
      app-network:
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  sound-cache:

networks:
  app-network:
    name: repo_default
    external: true
