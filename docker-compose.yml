services:
  sound-notifier:
    build: .
    command: ["python", "/app/app.py", "notifier"]
    environment:
      SUCCESS_SOUND_URL: ${SUCCESS_SOUND_URL:-https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg}
      FAILURE_SOUND_URL: ${FAILURE_SOUND_URL:-https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg}
      # Change this to control how many times the browser plays the sound.
      SOUND_REPEAT_COUNT: ${SOUND_REPEAT_COUNT:-3}
      SOUND_CACHE_DIR: /cache
      BROWSER_PORT: ${BROWSER_PORT:-8765}
    ports:
      - "${BROWSER_PORT:-8765}:8765"
    volumes:
      - sound-cache:/cache
    restart: unless-stopped

  web-monitor:
    build: .
    command: ["python", "/app/app.py", "monitor"]
    environment:
      TARGET_URLS: ${TARGET_URLS:-http://host.docker.internal:3000,http://platform-proxy:3000}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-3}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-2}
      NOTIFY_URL: ${NOTIFY_URL:-http://sound-notifier:8765/notify}
    depends_on:
      - sound-notifier
    networks:
      - default
      - app-network
    restart: unless-stopped

volumes:
  sound-cache:

networks:
  app-network:
    name: ${APP_NETWORK:-repo_default}
    external: true
